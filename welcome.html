<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Beamax</title>
    <link rel="stylesheet" href="styles/win-classic.css">
    <style>
        body {
            background-color: var(--win-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .welcome-dialog {
            background-color: #fff;
            border: 1px solid var(--win-border-dark);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            width: 450px;
            max-width: 95vw;
            display: flex;
            flex-direction: column;
        }

        .dialog-titlebar {
            background: linear-gradient(to right, #005a9e 0%, #0078d7 100%);
            color: #fff;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .dialog-content {
            padding: 30px;
            text-align: center;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .dialog-content h2 {
            color: #005a9e;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 24px;
        }

        .dialog-content p {
            color: #444;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        .dialog-actions {
            background-color: #f0f0f0;
            padding: 15px 30px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-proceed {
            background-color: #0078d7;
            color: white;
            border: 1px solid #005a9e;
            padding: 8px 20px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 2px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-proceed:hover {
            background-color: #005a9e;
        }

        .btn-back {
            background-color: #e1e1e1;
            color: #333;
            border: 1px solid #adadad;
            padding: 8px 20px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 2px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            background-color: #d1d1d1;
        }
    </style>
</head>
<body>

    <div class="welcome-dialog">
        <div class="dialog-titlebar">
            <span>Beamax Engineering Suite</span>
        </div>
        <div class="dialog-content">
            <div class="logo-icon">📐</div>
            <h2>Welcome to Beamax</h2>
            <p>You are about to launch the Beamax Multiple Document Interface (MDI) workspace. This environment allows you to analyze and design multiple continuous beams simultaneously.</p>
        </div>
        <div class="dialog-actions">
            <a href="landing.html" class="btn-back">Go Back</a>
            <a href="index.html" class="btn-proceed" onclick="localStorage.setItem('beamax_visited', 'true');">Proceed to Workspace</a>
        </div>
    </div>

</body>
</html>
